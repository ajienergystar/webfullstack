services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: latihanasp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LatihanASP@2026!"
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "LatihanASP@2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: latihanasp-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_SA_PASSWORD: "LatihanASP@2026!"
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/run-init.sh"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: latihanasp-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=LatihanASP_DB;User Id=sa;Password=Password123!;TrustServerCertificate=True;
      - ConnectionStrings__PosConnection=Server=host.docker.internal,1433;Database=LatihanASP_POS;User Id=sa;Password=Password123!;TrustServerCertificate=True;
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: latihanasp-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
